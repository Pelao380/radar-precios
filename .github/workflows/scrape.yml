# Scheduler de la demo gratuita: ejecuta el pipeline (scraping -> ETL -> stats -> alertas)
# contra la base de Neon cada 6 horas. Reemplaza a Celery beat + worker, que necesitan
# un proceso siempre encendido (ver README, "Despliegue").
#
# Secretos del repo: DATABASE_URL (obligatorio); SMTP_* y MAIL_FROM (opcionales, alertas).
# Ojo: GitHub pausa los cron de repos públicos tras 60 días sin actividad en el repo.
name: Scrape programado

on:
  schedule:
    - cron: "0 */6 * * *" # UTC
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Carga inicial: días de historial a generar (0 = solo el run normal)"
        default: "0"

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Carga inicial
        if: ${{ github.event.inputs.backfill_days != '' && github.event.inputs.backfill_days != '0' }}
        run: python -m radar.cli backfill --days "${{ github.event.inputs.backfill_days }}"
      - name: Pipeline
        run: python -m radar.cli run
